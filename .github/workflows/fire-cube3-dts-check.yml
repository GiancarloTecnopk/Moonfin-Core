name: Fire Cube 3 DTS Fix Verification

on:
  push:
    branches:
      - fix/fire-cube3-dts-stutter-20261024
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-dts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
      - name: Resolve dependencies
        run: flutter pub get
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Run Media3 DTS device policy tests
        working-directory: android
        run: gradle :moonfin_native_video:testDebugUnitTest --no-daemon --stacktrace
      - name: Verify Flutter Media3 wiring
        run: |
          flutter test test/playback/media3_decoder_preferences_test.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/playback/media3_player_backend.dart
