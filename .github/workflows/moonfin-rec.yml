name: Moonfin REC Android TV

on:
  push:
    branches: [moonfin-rec]
    paths-ignore: ['**.md']

permissions:
  contents: read

jobs:
  android-tv-rec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
      - name: Resolve dependencies
        run: flutter pub get
      - name: Check changed Dart files before building
        run: |
          dart format lib/data/viewmodels/recordings_view_model.dart lib/ui/screens/livetv/live_tv_player_screen.dart lib/ui/screens/livetv/live_tv_recordings_screen.dart test/data/viewmodels/recording_delete_test.dart lib/util/live_tv_recording.dart test/util/live_tv_recording_test.dart packages/server_core/lib/src/api/live_tv_api.dart packages/server_jellyfin/lib/src/api/jellyfin_live_tv_api.dart packages/server_emby/lib/src/api/emby_live_tv_api.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/data/viewmodels/recordings_view_model.dart lib/ui/screens/livetv/live_tv_player_screen.dart lib/ui/screens/livetv/live_tv_recordings_screen.dart test/data/viewmodels/recording_delete_test.dart lib/util/live_tv_recording.dart test/util/live_tv_recording_test.dart packages/server_core/lib/src/api/live_tv_api.dart packages/server_jellyfin/lib/src/api/jellyfin_live_tv_api.dart packages/server_emby/lib/src/api/emby_live_tv_api.dart
      - name: Test recording deletion and existing Live TV behavior
        run: flutter test test/data/viewmodels/recording_delete_test.dart test/data/viewmodels/recording_image_url_test.dart test/viewmodels/live_tv_guide_view_model_test.dart test/util/live_tv_recording_test.dart
      - name: Test manual recording requests
        run: |
          (cd packages/server_jellyfin && flutter pub get && flutter test test/jellyfin_live_tv_api_test.dart)
          (cd packages/server_emby && flutter pub get && flutter test test/emby_live_tv_api_test.dart)
      - name: Set up signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_TYPE: ${{ secrets.ANDROID_KEYSTORE_TYPE }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No Android keystore secret; using existing debug signing behavior."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=../release.keystore
          storeType=$STORE_TYPE
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: Build the single Android TV REC APK
        run: ./build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Moonfin-REC-AndroidTV
          path: Moonfin_AndroidTV_v*_REC.apk
          if-no-files-found: error


  windows-x64-rec:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build Windows x64 installer
        shell: pwsh
        run: .\build-windows.ps1 -Architecture x64
      - name: Verify Windows x64 artifact
        shell: pwsh
        run: |
          $artifacts = Get-ChildItem -Path . -Filter "Moonfin_Windows_v*.exe" -File -ErrorAction SilentlyContinue
          if (-not $artifacts) {
            throw "Windows build did not produce Moonfin_Windows_v*.exe"
          }
          $artifacts | ForEach-Object { Write-Host $_.FullName }
      - uses: actions/upload-artifact@v4
        with:
          name: Moonfin-REC-Windows-x64
          path: Moonfin_Windows_v*.exe
          if-no-files-found: error
