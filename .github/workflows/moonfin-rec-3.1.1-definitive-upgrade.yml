name: Moonfin REC 3.1.1 - Signed definitive upgrade for existing REC app
on:
  push:
    branches:
      - moonfin-rec-3.1.1-integration-20261119
    paths:
      - .github/workflows/moonfin-rec-3.1.1-definitive-upgrade.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Signed Android TV 3.1 update with original REC package and settings
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Free space for Flutter Android AOT
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/local/lib/android/sdk/system-images
          docker system prune --all --force || true
          df -h .
          available_kb=$(df -Pk . | awk 'NR==2 {print $4}')
          if (( available_kb < 8 * 1024 * 1024 )); then
            echo "::error::Insufficient runner disk space before compilation"
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve dependencies and apply original REC launcher identity
        run: |
          flutter pub get
          python -m pip install --disable-pip-version-check Pillow
          python scripts/apply_rec_branding.py --android
      - name: Use persistent Moonfin REC signing credentials
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_TYPE: ${{ secrets.ANDROID_KEYSTORE_TYPE }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          chmod 600 android/app/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=../release.keystore
          storeType=$STORE_TYPE
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 android/keystore.properties
      - name: Check all REC Live TV API implementations before Android AOT
        shell: bash
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings \
            packages/server_core/lib/src/api/live_tv_api.dart \
            packages/server_jellyfin/lib/src/api/jellyfin_live_tv_api.dart \
            packages/server_emby/lib/src/api/emby_live_tv_api.dart \
            packages/server_plex/lib/src/api/plex_live_tv_api.dart \
            packages/server_silo/lib/src/api/silo_live_tv_api.dart
      - name: Build Android TV 3.1.1 compatible with existing Moonfin REC package
        env:
          MOONFIN_TEST_ID_SUFFIX: .rec
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'android_tv_version: 3.1.1' pubspec.yaml
          grep -Fq 'android_tv_build_number: 2000042' pubspec.yaml
          # The signed upgrade must match REC 3.0's package and exceed build 2000035.
          grep -Fq 'val baseAppId = "org.moonfin.androidtv"' android/app/build.gradle.kts
          grep -Fq 'if (testIdSuffix == ".rec") "Moonfin REC"' android/app/build.gradle.kts
          # Do not build a parallel .rec31test package; keep REC 3.0 identity.
          test "$MOONFIN_TEST_ID_SUFFIX" = ".rec"
          flutter gen-l10n
          flutter build apk --release --flavor androidTv \
            --build-name 3.1.1 --build-number 2000042 \
            --dart-define=MOONFIN_FORCE_TV=true \
            --dart-define=DISTRIBUTION_CHANNEL=android_tv_apk
          cp build/app/outputs/flutter-apk/app-androidtv-release.apk \
            MoonfinREC_3.1.1_AndroidTV_update_signed.apk
      - name: Verify original REC package, version upgrade and persistent signing certificate
        shell: bash
        env:
          EXPECTED_CERT_SHA256: DA87543C1F1DD8CA6CBC13890A5D54A2E0995D78A8AD282808D4E4D94AC9B099
        run: |
          set -euo pipefail
          APK=MoonfinREC_3.1.1_AndroidTV_update_signed.apk
          test -s "$APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee rec31-identity.txt
          grep -F "package: name='org.moonfin.androidtv.rec'" rec31-identity.txt
          grep -F "versionCode='2000042'" rec31-identity.txt
          grep -F "application-label:'Moonfin REC'" rec31-identity.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee rec31-signature.txt
          grep -Fi "$EXPECTED_CERT_SHA256" rec31-signature.txt
          echo "Signed REC 3.1.1 upgrade APK verified: matches org.moonfin.androidtv.rec, versionCode 2000042, original release signing cert. Installing will update the existing REC 3.0 installation and retain its app data if that package remains installed. REC 3.0 source branch remains unchanged." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish REC 3.1.1 signed in-place upgrade candidate
        uses: actions/upload-artifact@v4
        with:
          name: MoonfinREC-3.1.1-AndroidTV-signed-update-REC-3.0
          path: MoonfinREC_3.1.1_AndroidTV_update_signed.apk
          if-no-files-found: error
          retention-days: 14
