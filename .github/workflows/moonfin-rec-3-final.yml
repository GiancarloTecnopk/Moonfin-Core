name: Moonfin REC 3.0 FINAL Android signed and Windows x64

on:
  push:
    branches:
      - moonfin-rec-3.0-final-20261104
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  prune-artifacts:
    name: Remove obsolete GitHub build artifacts, preserve REC 3.0 recovery copies
    runs-on: ubuntu-latest
    steps:
      - name: Delete old artifacts from 2.7 and redundant builds
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          token=os.environ['GH_TOKEN']
          repo=os.environ['REPOSITORY']
          root='https://api.github.com/repos/'+repo
          headers={'Authorization':'Bearer '+token, 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28'}
          def request(url, method='GET'):
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers, method=method), timeout=35) as response:
                  return json.load(response) if method=='GET' else response.status
          records=[]
          page=1
          while True:
              batch=request(f'{root}/actions/artifacts?per_page=100&page={page}')['artifacts']
              records.extend(batch)
              if len(batch)<100: break
              page+=1
          keep=set(['MoonfinREC-3.0.0-HEVC-DIAG-Android-signed','MoonfinREC-3.0.0-HEVC-PACING-AB-SEPARATA-Android-signed','MoonfinREC-3.0.0-HEVC-DIAG-Windows-x64-installer-unsigned'])
          removed=[]
          failed=[]
          total_bytes=0
          for item in records:
              if item['name'] in keep or item.get('expired'): continue
              try:
                  request(root+'/actions/artifacts/'+str(item['id']), 'DELETE')
                  total_bytes+=item.get('size_in_bytes',0)
                  removed.append(item['name'])
                  print('DELETED',item['id'],item['name'])
              except Exception as e:
                  failed.append((item['id'],str(e)))
                  print('DELETE FAILED',item['id'],str(e))
          summary=f'Legacy build artifacts deleted: {len(removed)} / {len(records)}; reclaimed {total_bytes/1073741824:.2f} GiB. Kept {len([x for x in records if x["name"] in keep])} recovery artifacts. Failed deletions: {len(failed)}.'
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as output:
              output.write('## GitHub artifact cleanup\n'+summary+'\n')
              for artifact_id, error in failed[:25]: output.write(f'\n- Failed #{artifact_id}: {error}')
          if failed: raise SystemExit('Cleanup incomplete; check DELETE FAILED lines above')
          PY
  build-rec-3:
    needs: prune-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Android's release/AOT build needs substantial temporary disk space.
      # Remove only unused preinstalled SDKs; keep Android SDK/NDK, Java and
      # Flutter intact. Otherwise armv7 app.so may fail with ENOSPC.
      - name: Free GitHub runner disk space for Android AOT
        shell: bash
        run: |
          set -euo pipefail
          echo "Before cleanup:"
          df -h .
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/local/lib/android/sdk/system-images
          if command -v docker >/dev/null 2>&1; then
            docker system prune --all --force >/dev/null 2>&1 || true
          fi
          echo "After cleanup:"
          df -h .
          available_kb=$(df -Pk . | awk 'NR==2 {print $4}')
          if (( available_kb < 8 * 1024 * 1024 )); then
            echo "::error::Less than 8 GiB available before Android build."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
      - name: Resolve dependencies
        run: flutter pub get
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install icon tooling and apply approved REC artwork (Android TV)
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/apply_rec_branding.py --android
      - name: Guard Moonfin REC features
        run: |
          grep -Fq 'shouldInstantRecordCurrentProgram(' lib/ui/screens/livetv/live_tv_player_screen.dart
          grep -Fq 'createChannelTimer(' lib/ui/screens/livetv/live_tv_player_screen.dart
          grep -Fq 'Registrazione interrotta' lib/ui/screens/livetv/live_tv_player_screen.dart
          grep -Fq 'refreshLibrary()' lib/ui/screens/settings/settings_side_panel.dart
          grep -Fq 'deleteRecordingTitle' lib/ui/screens/livetv/live_tv_recordings_screen.dart
      - name: REC Flutter tests and analysis
        run: |
          flutter gen-l10n
          flutter test test/util/live_tv_recording_test.dart
          flutter test test/data/viewmodels/recording_delete_test.dart
          flutter test test/playback/playback_quality_diagnostics_test.dart
          flutter test test/playback/media3_playback_health_test.dart
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/playback/playback_quality_diagnostics.dart lib/playback/playback_profile_diagnostics.dart lib/playback/media3_playback_health.dart lib/playback/media3_player_backend.dart lib/playback/playback_info_sections.dart lib/preference/user_preferences.dart lib/ui/screens/livetv/live_tv_player_screen.dart lib/ui/screens/livetv/live_tv_recordings_screen.dart lib/ui/screens/settings/settings_side_panel.dart packages/server_core/lib/src/api/live_tv_api.dart packages/server_jellyfin/lib/src/api/jellyfin_live_tv_api.dart packages/server_emby/lib/src/api/emby_live_tv_api.dart

      - name: Set up REC signing from existing release identity
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_TYPE: ${{ secrets.ANDROID_KEYSTORE_TYPE }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing persistent Moonfin REC release signing secrets. Refusing unsigned build."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          chmod 600 android/app/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=../release.keystore
          storeType=$STORE_TYPE
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 android/keystore.properties

      - name: Build signed Moonfin REC 3.0 production package APK
        env:
          MOONFIN_TEST_ID_SUFFIX: .rec
        run: |
          set -eu
          TV_VERSION=$(awk '/^  android_tv_version:/{print $2}' pubspec.yaml)
          TV_BUILD_NUMBER=$(awk '/^  android_tv_build_number:/{print $2}' pubspec.yaml)
          test "$TV_VERSION" = "3.0.0"
          test "$TV_BUILD_NUMBER" = "2000035"
          flutter gen-l10n
          flutter build apk --release --flavor androidTv \
            --build-name "$TV_VERSION" --build-number "$TV_BUILD_NUMBER" \
            --dart-define=MOONFIN_FORCE_TV=true \
            --dart-define=DISTRIBUTION_CHANNEL=android_tv_apk
          cp build/app/outputs/flutter-apk/app-androidtv-release.apk \
            MoonfinREC_3.0.0_AndroidTV_signed.apk

      - name: Verify APK identity, upgrade version and SAME signing certificate
        env:
          EXPECTED_CERT_SHA256: DA87543C1F1DD8CA6CBC13890A5D54A2E0995D78A8AD282808D4E4D94AC9B099
        run: |
          set -eu
          APK="MoonfinREC_3.0.0_AndroidTV_signed.apk"
          test -s "$APK"
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          BUILD_TOOLS=$(find "$SDK_DIR/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee dts-apk-identity.txt
          grep -F "package: name='org.moonfin.androidtv.rec'" dts-apk-identity.txt
          grep -F "versionCode='2000035'" dts-apk-identity.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee dts-apk-signature.txt
          grep -Fi "$EXPECTED_CERT_SHA256" dts-apk-signature.txt
          echo "Verified REC package, upgraded version and original signing certificate." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish signed Moonfin REC 3.0 FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: MoonfinREC-3.0.0-FINAL-AndroidTV-signed
          path: MoonfinREC_3.0.0_AndroidTV_signed.apk
          if-no-files-found: error
          retention-days: 90

  build-rec-3-windows:
    needs: prune-artifacts
    name: Build Moonfin REC 3.0 Windows x64 installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install icon tooling and apply approved REC artwork (Windows)
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/apply_rec_branding.py --windows

      - name: Build isolated Moonfin REC Windows installer
        shell: pwsh
        run: .\\build-windows.ps1 -Rec

      - name: Verify installer is present
        shell: pwsh
        run: |
          $installer = "MoonfinREC_Windows_v3.0.0.exe"
          if (!(Test-Path $installer)) {
            throw "Missing Moonfin REC Windows installer: $installer"
          }
          if ((Get-Item $installer).Length -lt 1048576) {
            throw "Installer size too small: $installer"
          }
          Write-Host "Moonfin REC 3.0 Windows x64 installer is ready."

      - name: Upload Moonfin REC 3.0 Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: MoonfinREC-3.0.0-FINAL-Windows-x64-installer-unsigned
          path: MoonfinREC_Windows_v3.0.0.exe
          if-no-files-found: error
          retention-days: 90

  publish-rec-3-final-release:
    needs: [build-rec-3, build-rec-3-windows]
    if: ${{ success() }}
    name: Publish direct APK and Windows installer links
    runs-on: ubuntu-latest
    steps:
      - name: Download Android signed APK
        uses: actions/download-artifact@v4
        with:
          name: MoonfinREC-3.0.0-FINAL-AndroidTV-signed
          path: .release/android
      - name: Download Windows x64 installer
        uses: actions/download-artifact@v4
        with:
          name: MoonfinREC-3.0.0-FINAL-Windows-x64-installer-unsigned
          path: .release/windows
      - name: Publish immutable 3.0 release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='moonfin-rec-v3.0.0-build2000035'
          apk='.release/android/MoonfinREC_3.0.0_AndroidTV_signed.apk'
          win='.release/windows/MoonfinREC_Windows_v3.0.0.exe'
          test -s "$apk"
          test -s "$win"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" "$win" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$apk" "$win" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'Moonfin REC 3.0.0 - Android TV / Windows x64' --notes 'Signed Android TV APK, package org.moonfin.androidtv.rec (versionCode 2000035), original release signing identity; Windows x64 installer (unsigned). Includes REC Live TV, EPG refresh, Jellyfin library refresh, playback diagnostics and HEVC Media3 pacing fix candidate.'
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,assets --jq '{url:.url,assets:[.assets[].name]}' | tee -a "$GITHUB_STEP_SUMMARY"
