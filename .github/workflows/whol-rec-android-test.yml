name: Whol REC - Jellyfin 12 Fire TV experimental APK
on:
  push:
    branches:
      - whol-rec
    paths:
      - .github/workflows/whol-rec-android-test.yml
      - scripts/apply_whol_rec.py
      - whol_rec_overlay/**
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    name: Build isolated Wholphin REC Kotlin TV test
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8"
      CI: "true"
      # The original persistent signing key is already stored in repository Secrets.
      SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      KEY_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      KEY_STORE_TYPE: ${{ secrets.ANDROID_KEYSTORE_TYPE }}
    steps:
      - name: Checkout our isolated REC overlay branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout Wholphin Jellyfin 12 development baseline
        uses: actions/checkout@v4
        with:
          repository: damontecres/Wholphin
          ref: 572090863cb7d775cb42818fec632e32fb297dc9
          path: wholphin-upstream
          fetch-depth: 0
          persist-credentials: false
      - name: Verify upstream commit to keep test reproducible
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C wholphin-upstream rev-parse HEAD)" = "572090863cb7d775cb42818fec632e32fb297dc9"
          echo 'Wholphin Jellyfin 12 development baseline validated' >> "$GITHUB_STEP_SUMMARY"
      - name: Free disk for Gradle and Android build
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          df -h .
      - name: Setup JDK 21 (upstream Wholphin requirement)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
      - name: Setup Android SDK 37 and build tools
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools build-tools;36.0.0"
      - name: Verify permanent signing credentials exist
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_STORE_PASSWORD"
          echo 'Persistent keystore configured. Wholphin REC will retain app ID and signer.' >> "$GITHUB_STEP_SUMMARY"
      - name: Apply our manual REC/STOP and dedicated TV package
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_whol_rec.py wholphin-upstream
          grep -Fq 'com.github.damontecres.wholphin.wholrec' wholphin-upstream/app/build.gradle.kts
          expected_code=$((20001000 + GITHUB_RUN_NUMBER))
          grep -Fq "versionCode = $expected_code" wholphin-upstream/app/build.gradle.kts
          grep -Fq 'signingConfig = signingConfigs.getByName("ci")' wholphin-upstream/app/build.gradle.kts
          echo "Wholphin REC build $GITHUB_RUN_NUMBER; versionCode $expected_code" >> "$GITHUB_STEP_SUMMARY"
          grep -Fq 'suspend fun startManualRecording(' wholphin-upstream/app/src/main/java/com/github/damontecres/wholphin/services/LiveTvService.kt
          grep -Fq 'WholRecControls(' wholphin-upstream/app/src/main/java/com/github/damontecres/wholphin/ui/playback/PlaybackPage.kt
      - name: Compile and run manual REC timer isolation tests
        shell: bash
        working-directory: wholphin-upstream
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :app:testDefaultDebugUnitTest \
            --tests com.github.damontecres.wholphin.services.WholRecTimerPolicyTest \
            --tests com.github.damontecres.wholphin.util.WholRecVersionTest
      - name: Build Android TV APK with Wholphin original playback engines
        shell: bash
        working-directory: wholphin-upstream
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --max-workers=2 :app:assembleDefaultDebug
          find app/build/outputs/apk/default/debug -name '*.apk' -type f -ls
      - name: Verify REC package and persistent original signing certificate
        shell: bash
        run: |
          set -euo pipefail
          cd wholphin-upstream
          apk="$(find app/build/outputs/apk/default/debug -name '*.apk' -type f | grep -vE '(armeabi-v7a|arm64-v8a|x86_64)' | head -1)"
          test -n "$apk"
          test -s "$apk"
          cp "$apk" ../WholphinREC_Jellyfin12_FireTV_TEST.apk
          sdk="$ANDROID_HOME"
          tools="$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$tools/aapt" dump badging "../WholphinREC_Jellyfin12_FireTV_TEST.apk" | tee ../whol-rec-identity.txt
          grep -F "package: name='com.github.damontecres.wholphin.wholrec.debug'" ../whol-rec-identity.txt
          grep -F "application-label:'Wholphin REC Test'" ../whol-rec-identity.txt
          grep -F "versionCode='$((20001000 + GITHUB_RUN_NUMBER))'" ../whol-rec-identity.txt
          "$tools/apksigner" verify --verbose --print-certs "../WholphinREC_Jellyfin12_FireTV_TEST.apk" | tee ../whol-rec-signature.txt
          grep -Fi 'DA87543C1F1DD8CA6CBC13890A5D54A2E0995D78A8AD282808D4E4D94AC9B099' ../whol-rec-signature.txt
          cd ..
          sha256sum WholphinREC_Jellyfin12_FireTV_TEST.apk > WholphinREC_SHA256SUMS.txt
          echo 'REC without EPG + STOP and TV OSD built and persistently signed; future APKs update in place by versionCode.' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish test APK for Fire TV Cube
        uses: actions/upload-artifact@v4
        with:
          name: WholphinREC-Jellyfin12-FireTV-PERSISTENT-SIGNED
          path: |
            WholphinREC_Jellyfin12_FireTV_TEST.apk
            WholphinREC_SHA256SUMS.txt
            whol-rec-identity.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish persistently signed APK as a permanent GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          apk=WholphinREC_Jellyfin12_FireTV_TEST.apk
          test -s "$apk"
          tag="whol-rec-persistent-$GITHUB_RUN_NUMBER"
          cat > WHOL_REC_RELEASE_NOTES.md <<'EOF'
          # Wholphin REC - signed test with permanent certificate
          - Experimental client for Jellyfin 12 / Fire TV Cube.
          - REC manual without EPG, STOP REC, indicator, confirmation, duration selection.
          - Original Wholphin player engines unchanged.
          - Consistent package: com.github.damontecres.wholphin.wholrec.debug
          - Signed with the existing persistent project release key on every build.
          - Future builds have incrementing versionCode and install IN PLACE, preserving Jellyfin login and settings.
          - IMPORTANT: Old Wholphin REC Test 1 and Test 2 used random debug keys. The first
            migration from an old Test 1/Test 2 requires uninstalling ONLY Wholphin REC Test,
            then installing this persistent-key APK. Future updates MUST NOT require uninstall.
          - Do not uninstall Moonfin REC: different package, unchanged.
          EOF
          gh release create "$tag" "$apk" WholphinREC_SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false \
            --title "Wholphin REC - persistent signed Fire TV TEST $GITHUB_RUN_NUMBER" \
            --notes-file WHOL_REC_RELEASE_NOTES.md
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url --jq .url | tee -a "$GITHUB_STEP_SUMMARY"
