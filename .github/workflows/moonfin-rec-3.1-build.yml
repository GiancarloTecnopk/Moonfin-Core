name: Moonfin REC 3.1 RC1 signed Android TV and Windows x64
on:
  push:
    branches:
      - moonfin-rec-3.1-integration-20261114
    paths:
      - .github/workflows/moonfin-rec-3.1-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Signed Android TV 3.1.0 RC1 separate from working REC 3.0
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Free space for Flutter Android AOT
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/local/lib/android/sdk/system-images
          docker system prune --all --force || true
          df -h .
          available_kb=$(df -Pk . | awk 'NR==2 {print $4}')
          if (( available_kb < 8 * 1024 * 1024 )); then
            echo "::error::Insufficient runner disk space before compilation"
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve dependencies and apply original REC launcher identity
        run: |
          flutter pub get
          python -m pip install --disable-pip-version-check Pillow
          python scripts/apply_rec_branding.py --android
      - name: Use persistent Moonfin REC signing credentials
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_TYPE: ${{ secrets.ANDROID_KEYSTORE_TYPE }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.keystore
          chmod 600 android/app/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=../release.keystore
          storeType=$STORE_TYPE
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 android/keystore.properties
      - name: Build signed 3.1 test APK with separate package
        env:
          MOONFIN_TEST_ID_SUFFIX: .rec31test
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'android_tv_version: 3.1.0' pubspec.yaml
          grep -Fq 'android_tv_build_number: 2000036' pubspec.yaml
          flutter gen-l10n
          flutter build apk --release --flavor androidTv \
            --build-name 3.1.0 --build-number 2000036 \
            --dart-define=MOONFIN_FORCE_TV=true \
            --dart-define=DISTRIBUTION_CHANNEL=android_tv_apk
          cp build/app/outputs/flutter-apk/app-androidtv-release.apk \
            MoonfinREC_3.1.0_RC1_AndroidTV_signed.apk
      - name: Verify test package and original production signing certificate
        shell: bash
        env:
          EXPECTED_CERT_SHA256: DA87543C1F1DD8CA6CBC13890A5D54A2E0995D78A8AD282808D4E4D94AC9B099
        run: |
          set -euo pipefail
          APK=MoonfinREC_3.1.0_RC1_AndroidTV_signed.apk
          test -s "$APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee rec31-identity.txt
          grep -F "package: name='org.moonfin.androidtv.rec31test'" rec31-identity.txt
          grep -F "versionCode='2000036'" rec31-identity.txt
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee rec31-signature.txt
          grep -Fi "$EXPECTED_CERT_SHA256" rec31-signature.txt
          echo "Signed REC 3.1.0 RC test APK verified; existing REC 3.0 remains untouched." >> "$GITHUB_STEP_SUMMARY"
      - name: Publish Android TV candidate
        uses: actions/upload-artifact@v4
        with:
          name: MoonfinREC-3.1.0-RC1-AndroidTV-signed-separate
          path: MoonfinREC_3.1.0_RC1_AndroidTV_signed.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Moonfin REC 3.1.0 Windows x64 RC1 installer
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Apply original REC branding
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python scripts/apply_rec_branding.py --windows
      - name: Build Moonfin REC Windows x64 installer
        shell: pwsh
        run: .\build-windows.ps1 -Rec
      - name: Check installer output
        shell: pwsh
        run: |
          $path = 'MoonfinREC_Windows_v3.1.0.exe'
          if (!(Test-Path $path)) { throw "Missing REC Windows installer: $path" }
          if ((Get-Item $path).Length -lt 1048576) { throw 'Installer appears truncated' }
      - name: Publish Windows x64 candidate
        uses: actions/upload-artifact@v4
        with:
          name: MoonfinREC-3.1.0-RC1-Windows-x64-installer-unsigned
          path: MoonfinREC_Windows_v3.1.0.exe
          if-no-files-found: error
          retention-days: 14
